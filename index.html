},

ch3_scene2:{
text:"敬妃宫中。掌事姑姑匆匆回话，脸色发白。||\"娘娘，尚宫局的裴掌记……没了。天没亮，在自己院里的井里捞上来的。内务府说，失足。\"||敬妃皱眉：\"她当差十年，最是稳妥，怎会夜里失足？\"||\"说是皇后娘娘静养，各宫账目都压过去，她连日熬夜核账，神思恍惚……\"||角落里誊录账册的你，笔悬在半空。||皇后早不病晚不病，偏在敬妃接权时病——以退为进。裴掌记连日核的不是例账，是旧账。她不是因为钱死的——是看见了什么。",
choices:[
{text:"1、上报敬妃，借势拿到查账权",next:"ch3_q5_a"},
{text:"2、夜里私自查验",next:"ch3_q5_b"},
{text:"3、装作什么都不知道",next:"ch3_q5_c"}
]
},

ch3_q5_a:{
text:"次日。你跪于敬妃面前。||\"娘娘，臣妾有一事不敢不言。裴掌记坠井那日，臣妾在尚宫局见过她，抱着一摞景和二年的旧账。臣妾多问了一句，她说——'旧账不平，寝食难安。'\"||敬妃指尖轻敲扶手：\"景和二年的旧账。你倒是记得清楚。\"||\"臣妾父亲在户部。账目上最忌讳四个字——旧账不平。旧账不平，新账必假。臣妾不敢揣测裴掌记之死，只是若那旧账里真有不妥，娘娘趁早核清，是娘娘的功；若等到旁人核出来——\"||你没说下去。敬妃盯了你足足十息，忽然轻笑。||\"沈家的女儿，果然都会算账。\"||她放下茶盏：\"明日起，你去尚宫局，帮本宫核近三年的账。记住——看见什么，听见什么，只回禀本宫一个人。\"||你叩首：\"臣妾遵命。\"",
choices:[{text:"前往尚宫局库房",next:"ch3_scene3"}]
},

ch3_q5_b:{
text:"当夜，你趁夜色潜入尚宫局库房，想私自查验裴掌记经手的旧账。||账册还没翻到第三本，门外火把通明。||\"什么人！\"||你被当场拿获。一个入宫不到半月的新人，深夜私闯尚宫局、翻阅宫档——这个罪名，不需要皇后动手，敬妃也保不住你。||你被打入慎刑司。三日后，\"畏罪自尽\"。||越界的代价，是命。",
isEnd:true,
endingId:"death_overstep",
choices:[{text:"回到开篇",next:"start"}]
},

ch3_q5_c:{
text:"你垂下眼，继续誊录账册，仿佛什么都没听见。||裴掌记的死，与你无关。旧账里有什么，也与你无关。||敬妃等了两日，见你毫无动静，便改用了旁人去核账。||你错失了拿到查账权的机会。但至少，你还安全。||只是——有些机会，错过了就不会再来。",
choices:[{text:"前往尚宫局库房",next:"ch3_scene3"}]
},

ch3_scene3:{
text:"尚宫局库房。账册堆满架，尘埃浮在斜光里。||你将七年\"佛事\"账目排成一列，指尖缓缓划过，脸色渐冷。||七年。每年入冬，以\"佛事\"为名拨出一笔银子，数目几乎分毫不差。||真正的佛事开销，随物价、随人心浮动——哪有一笔佛事，七年如一日，像用尺子量出来的？||除非它不是开销，是定额。不是花出去的——是转出去的。||你翻到景和元年原始账册，\"佛事\"名目第一次出现的那一页。签批栏，墨迹工整。||特写：签批人——\"沈听舟\"。那个\"舟\"字，最后一笔微微上挑。||你的手抖了一下，缓缓合上账纸。||是父亲的笔迹。你从小看到大的习惯，绝不会认错。||前世，你以为沈家案是林晚棠构陷的冤案。可现在看着这个签名，你忽然不敢确定了——沈家的案子，到底有多少，是冤的？",
choices:[
{text:"1、悄然退出，不动架上任何册子",next:"ch3_q6_a"},
{text:"2、偷偷抄录一份藏起",next:"ch3_q6_b"},
{text:"3、立刻告知敬妃",next:"ch3_q6_c"}
]
},

ch3_q6_a:{
text:"你深吸一口气，将账册原样放回架上，抚平灰尘，悄然退出库房。||没有动任何册子，没有留下任何痕迹。||影账的秘密，你暂时藏在心底。日后再查，从长计议。||至少此刻，没有人知道你看见了父亲的签名。",
choices:[{text:"前往第四章",next:"ch4_start"}]
},

ch3_q6_b:{
text:"你迅速取出随身的纸笔，将关键页——签批人、数目、名目——一一抄录，折好藏入袖中。||手心全是汗。||盗取宫档抄录，一旦被发现，就是死罪。但这份证据，或许将来能救沈家一命。||你将账册放回，退出库房。袖中的抄本沉甸甸的，像一块烙铁。",
choices:[{text:"前往第四章",next:"ch4_start"}]
},

ch3_q6_c:{
text:"你回到敬妃宫中，将影账之事一一禀明。||包括签批人是你父亲沈听舟。||敬妃听完，沉默良久。||\"你倒是坦诚。\"||她没有立刻表态，但你看得出来——她对你的信任又深了一层。一个愿意把自家把柄交到主子手里的人，是可用的。||但与此同时，沈家与影账的牵连，也彻底暴露在了敬妃面前。||这是一步险棋。",
choices:[{text:"前往第四章",next:"ch4_start"}]
},

ch4_start:{
text:"【第四章 父女棋局】||沈府正堂。你归家省亲，正堂内屏退左右。沈听舟亲手为女儿斟茶。茶烟在两人之间散开。||\"宫里可还习惯？\"||\"都好。只是……父亲，女儿在宫里帮敬妃娘娘核账，核到了景和元年的一笔'佛事'。每年入冬拨银，七年不变。签批人那一栏，是父亲的名字。\"||沈听舟倒茶的手几不可察地一顿。长久的沉默。||\"你看见了。\"||\"女儿看见了。那笔账，到底是什么？\"||沈听舟望着茶汤：\"珠儿，你父亲在户部三十年。天下钱粮，最难的不是收，也不是花——是花在哪儿，不能让所有人知道。\"||\"景和元年，北边用兵，军饷吃紧。可军饷走户部，每一笔都要过三司、留档、被御史盯着。那年有一支兵，等不起。\"||\"等不起，就不能走户部。先帝默许，从宫里走。宫中用度的银子拨出去，名义'佛事'，实则转往边关充作军饷。这笔账不入正册，只存内务府，由户部一人签批留底——那个人，就是我。\"||你声音压低：\"所以那不是贪墨，是军饷。可既然是军饷，为何要见不得光？为何要留父亲的签批？\"||沈听舟苦笑：\"因为账要走，就得有人担。真要事发，总得有一个签批的人认罪——担下这个罪，账就'平'了，就不会往上追，追到宫里，追到先帝头上。从签下的那一刻起，我就是那个担罪的人。\"||原来如此。前世的沈家案，不是林晚棠凭空构陷——是那笔账走了七年，军饷转完了，账该平了。平账，就要有人垫底。垫底的人，早就选好了。林晚棠递的，只是一把刀。真正的刀，从一开始就悬在沈家头上。||\"父亲，这笔账如今还在走吗？\"||沈听舟摇头：\"今上登基后，就停了。账停了，可账本还在。账本在，担罪的人，就还在。\"||他忽然郑重：\"珠儿，你今日来问，是想救沈家，还是救你自己？\"||\"都想。但女儿更想知道——这盘棋，执棋的手在哪儿？\"||沈听舟起身，背对她，望向窗外：\"下棋的人，从来不在棋盘上。\"||他转回，恢复温和：\"够了，茶要凉了。陪父亲用些点心吧。\"",
choices:[
{text:"1、提醒父亲早做退路",next:"ch4_q7_a"},
{text:"2、不提醒",next:"ch4_q7_b"}
]
},

ch4_q7_a:{
text:"你犹豫片刻，还是开口：\"父亲，影账虽停，但账本还在。女儿担心……不如早做退路。\"||沈听舟端茶的手顿了顿。||他没有回答，只是轻轻叹了口气：\"珠儿，有些退路，不是想走就能走的。为父在户部三十年，签过的字、担过的责，比你想象的多。\"||\"不过……你说得对。为父会留意。\"||他答应了。但你看得出来，他并没有真的放在心上。||提醒父亲，或许能让他早退一步。但影账的风险，也可能因此提前暴露。",
choices:[{text:"前往宫门口",next:"ch4_scene2"}]
},

ch4_q7_b:{
text:"你将到了嘴边的话咽了回去。||\"父亲说的是。茶要凉了。\"||你没有提醒父亲。||不是不想，而是你知道——在一切尚未明朗之前，任何轻举妄动都可能打草惊蛇。维持现状，至少暗线不动。||父女信任或许因此降了一分。但你保住了底牌。",
choices:[{text:"前往宫门口",next:"ch4_scene2"}]
},

ch4_scene2:{
text:"宫门口。黄昏。||你的马车驶近宫门。另一辆不起眼的马车里，一人下车，玄色锦袍。两车交错。||萧景澜。||他的随从快步近前，往车帘里递了一样东西，又迅速退开，快得像没发生过。||你摊开掌心：一枚铜钱形状的薄铁片，正面刻着一个\"账\"字，背面一串小数字。||萧景澜的声音被风吹得断续，却字字清晰：\"沈姑娘，账本最危险的地方，不是有错——是太干净了。\"||你掀帘望去。暮色里，萧景澜的背影已远，像一滴墨落进水里。||他也知道影账。这个表面闲散的三皇子，到底是什么人？",
choices:[
{text:"1、自己破译铁钱",next:"ch4_q8_a"},
{text:"2、约见三皇子当面问清",next:"ch4_q8_b"},
{text:"3、呈交敬妃",next:"ch4_q8_c"}
]
},

ch4_q8_a:{
text:"你将铁钱收入袖中，没有告诉任何人。||背面的小数字，你反复揣摩。终于在一个深夜，你破译了——那是玄镜司的卷宗编号。||玄镜司。皇帝的耳目。||萧景澜为什么要给你这个？他想让你查什么？||你决定自己查。不问任何人，主动权在自己手里。",
choices:[{text:"前往第五章",next:"ch5_start"}]
},

ch4_q8_b:{
text:"你托人递了消息，约萧景澜在御花园听雨轩相见。||他来得很准时，似乎早料到你会找他。||\"沈姑娘这么快就想通了？\"||\"殿下给的东西，臣女看不懂。想请殿下当面说清楚。\"||萧景澜笑了：\"好。那我们就好好谈谈。\"||你提前进入了同盟。但从这一刻起，你的节奏，有一半握在了他手里。",
choices:[{text:"前往第五章",next:"ch5_start"}]
},

ch4_q8_c:{
text:"你将铁钱呈给了敬妃，如实禀报了萧景澜拦车赠物之事。||敬妃接过铁钱，端详片刻，神色复杂。||\"三皇子……倒是会选人。\"||她没有责罚你私通外臣，反而将铁钱收下，说会替你\"妥善处理\"。||你换来了敬妃的庇护。但从此，你被绑上了敬妃一系的船。萧景澜那边，也再无回旋余地。",
choices:[{text:"前往第五章",next:"ch5_start"}]
},

ch5_start:{
text:"【第五章 玄镜司的影子】||听雨轩。御花园东北角，背山面水，四下无人。萧景澜独坐轩中，两盏茶。你至，落座。||你开门见山：\"殿下那枚铁钱，臣女看懂了。玄镜司——殿下是什么人？\"||萧景澜笑：\"我就知道，户部侍郎家的女儿看得懂账。\"||他续茶：\"玄镜司，是父皇的耳目。可耳目这种东西，用久了，会自己长出心思。我生母去世那年，玄镜司的卷宗里少了一页。我找了十年。\"||\"殿下的生母……\"||\"我生母是罪臣之女。那桩罪臣之案，和一笔军饷有关。账从宫里走，线头就在宫里。沈姑娘，你在尚宫局核到景和元年那笔'佛事'了，对不对？\"||你不答。||\"别紧张，我是来交换的。你有账内的线头——哪笔银子进了宫、走了哪个名目、经了谁的手。可账内的线头到'转出去'那一步就断了。而我，有账外的渠道。玄镜司的暗桩、京畿的商路、边关的驿报——银子出宫之后走哪条路、进哪支兵、落到谁手里，我能查。\"||你缓缓：\"殿下要这个同盟，是为了查生母的死因。臣女要这个同盟，是为了活命。\"||\"不错。\"",
choices:[
{text:"1、只换线索，互不涉命",next:"ch5_q9_a"},
{text:"2、互托把柄，深度绑定",next:"ch5_q9_b"},
{text:"3、要求殿下先交出玄镜司卷宗作诚意",next:"ch5_q9_c"}
]
},

ch5_q9_a:{
text:"你把话说在前头：\"这笔交换：臣妾给账内线头，殿下给账外渠道。除此之外——若有一日要用臣妾的命来平账，臣妾不给。同样，若有一日要用殿下的命来平臣妾的账，殿下也不必给。\"||萧景澜怔了怔，随即低笑：\"好。沈姑娘是个明白人。这宫里，明白人不多。\"||你举杯轻碰：\"这宫里明白人不少，装糊涂的人更多。\"||两人饮茶。没有试探，没有暧昧——这是两本各怀亏空的账，决定暂时记在同一本册子上。",
choices:[{text:"前往储秀宫正殿对账",next:"ch5_scene2"}]
},

ch5_q9_b:{
text:"你沉吟片刻：\"只换线索，怕是不够。这宫里的水太深，你我若不深度绑定，迟早被各个击破。\"||萧景澜挑眉：\"沈姑娘的意思是？\"||\"互托把柄。你知道我的底牌，我知道你的底线。谁也跑不了，谁也不敢先卖谁。\"||萧景澜凝视你良久，缓缓点头：\"好。那就——深度绑定。\"||情报互通更深了。但任何一方出事，都会牵连另一方。这是一把双刃剑。",
choices:[{text:"前往储秀宫正殿对账",next:"ch5_scene2"}]
},

ch5_q9_c:{
text:"你没有立刻答应，而是端起茶盏，语气平淡：\"殿下要同盟，总得先拿出点诚意。玄镜司那份少了一页的卷宗——不如先交一份给臣妾看看？\"||萧景澜脸上的笑意淡了。||\"沈姑娘，这就没意思了。我若把卷宗交给你，等于把生母的死因交到你手里。你觉得，我会这么做？\"||气氛僵住。||你试探了他的底线。他没有翻脸，但同盟的事，暂时谈崩了。||你失去了一个潜在的盟友。",
choices:[{text:"前往储秀宫正殿对账",next:"ch5_scene2"}]
},

ch5_scene2:{
text:"储秀宫正殿。||淑贵妃的掌事姑姑带着内务府管事，当众对账。殿外围了一圈看热闹的嫔妃，包括林晚棠。敬妃宫里有人旁证。||掌事姑姑把账册往案上一摊：\"沈贵人，白纸黑字，脂粉折色五两。贵人还要辩么？\"||你不慌不忙，取出私账小册：\"姑姑说的是内务府的账。这是臣妾入宫以来每一笔开支的私账——哪一日、领了什么、经手是谁、折银多少，一笔一笔记着。请姑姑对一对。\"||特写：册页分\"入\"\"出\"两栏，出的每笔后有经手人画押，月底合拢，分毫不差。||\"脂粉一项，臣妾共领五次，每次二两。内务府册上这个月记五两——多出来的三两，是哪个经手人替臣妾领的？\"||掌事姑姑翻册，翻来覆去——\"五两\"后面没有经手画押。殿内死寂。||\"副册在谁手里，谁就能改总额而留不下画押的破绽——除非连副册也改了。管事公公，这个月的副册，可否取来一观？\"||内务府管事额头冒汗。副册取来，涂改的墨色比前后页都新。敬妃宫里的人当场验看。||管事跪地，面如死灰：\"奴才认罪……是受人指使……\"||三日后。宣旨太监展开圣旨。||\"内务府管事改账栽赃，革职发往辛者库。沈氏持账守正，可嘉——晋嫔位，赐号'娴'，协理六宫支应！\"||谢恩。人群里林晚棠看着你起身，脸上笑意淡得几乎没有。",
choices:[{text:"前往凤仪宫",next:"ch5_scene3"}]
},

ch5_scene3:{
text:"凤仪宫。夜。||皇后\"病愈\"，单独召见你。熏香袅袅，皇后拉着你的手，句句体己。||\"这宫里有了你，本宫和皇上，总算能放心账目了。\"||你低头谢恩：\"能为娘娘分忧，是臣妾的福分。\"||你垂眼的一瞬，目光落在皇后手边的茶盏上——青白釉，盏底一圈极淡的窑斑。||【闪回】冷宫。林晚棠端来的毒酒杯，同一窑的釉色，连窑斑的位置都一样。||这样的御窑器皿，不是寻常嫔妃宫里能有的。前世赐你毒酒的，从来不是林晚棠一个人。",
choices:[
{text:"1、愈发恭顺，不动声色",next:"ch5_q10_a"},
{text:"2、借敬妃之口婉拒后续召见",next:"ch5_q10_b"},
{text:"3、故意提起\"冷宫旧事\"试探",next:"ch5_q10_c"}
]
},

ch5_q10_a:{
text:"你抬眼，笑得愈发恭顺：\"臣妾，告退。\"||你退出凤仪宫，后背已被冷汗浸透。||但你的脸上，没有露出半分异样。||皇后没有察觉。至少此刻，她还以为你是那个温顺、好用、不懂权谋的娴嫔。||把恐惧藏好，是你在这宫里活下去的第一课。",
choices:[{text:"前往第六章",next:"ch6_start"}]
},

ch5_q10_b:{
text:"你回去后，托敬妃宫里的人递了话——说协理六宫支应事务繁忙，恐怕难以常来凤仪宫请安。||话递得委婉，但皇后听出了你的意思。||她没有强求，只是淡淡说了一句：\"娴嫔倒是个大忙人。\"||你拉开了距离。但皇后的疑心，也因此生了根。",
choices:[{text:"前往第六章",next:"ch6_start"}]
},

ch5_q10_c:{
text:"你忽然开口，语气轻描淡写：\"说起来，臣妾前几日整理旧物，翻到一只青白釉的小盏，和娘娘这只倒是有些像。听老宫人说，这种釉色，从前冷宫里也用过……\"||话没说完，皇后的脸色就变了。||她盯着你看了很久，忽然笑了，笑得温柔：\"娴嫔倒是细心。改日，本宫让人送你一套。\"||你告退出来，腿都是软的。||你试探了皇后。但你也打草惊蛇了。||皇后不会再给你第二次机会。||三天后，你被赐下毒酒。和前世一模一样的杯子，一模一样的味道。",
isEnd:true,
endingId:"death_snake",
choices:[{text:"回到开篇",next:"start"}]
},

ch6_start:{
text:"【第六章 中秋宫宴】||御花园主宴。夜。||灯火从含元殿点到太液池，水面莲花灯千百盏。丝竹声中，太后居皇帝侧首。||太后忽然开口，声音不高却压住全场：\"哀家听说，如今宫里的账核得越发齐整了。趁着今日高兴，把近三年的宫账当宴清一清？也让列位大人看看，皇家的账，经得起看。\"||殿内一静。皇帝指尖在杯沿轻磕。你垂眼。||太后这一手，前世没有。她要查的是账——还是查账的人？",
choices:[
{text:"1、主动请缨协查",next:"ch6_q11_a"},
{text:"2、静观其变，等别人出头",next:"ch6_q11_b"},
{text:"3、称病告退避席",next:"ch6_q11_c"}
]
},

ch6_q11_a:{
text:"你出列，跪拜：\"太后娘娘，臣妾协理六宫支应，对近三年账目略有经手。若娘娘不弃，臣妾愿为娘娘协查。\"||太后看了你一眼，唇角微勾：\"好。娴嫔有心。\"||你把自己摆进了明处。成为查账的主导者。||这是一步险棋——查得好，是大功；查得不好，就是替罪羊。||但你知道，在这深宫里，不进则退。",
choices:[{text:"铅银案发",next:"ch6_scene2"}]
},

ch6_q11_b:{
text:"你垂眸不语，静观其变。||果然，有别的嫔妃出列请缨。太后准了。||你稳妥地避开了风头。但也错失了在太后面前立功的机会。||查账的主导权，落到了别人手里。你只能在旁协助。",
choices:[{text:"铅银案发",next:"ch6_scene2"}]
},

ch6_q11_c:{
text:"你忽然扶住额头，面露难色：\"太后娘娘，臣妾……臣妾有些不适，想告退歇息。\"||太后的目光在你脸上停了一瞬。||\"既然不适，就下去吧。\"||你退席了。但满殿的人都看在眼里——太后正要查账，你就病了。||御前失仪，还显得心虚。||皇帝的眉头皱了起来。",
choices:[{text:"铅银案发",next:"ch6_scene2"}]
},

ch6_scene2:{
text:"内务府管事捧账册与节银上殿，唱报。||\"江南织造进贡节银，十万两——\"||管事失手，一锭银子砸在金砖上——\"当\"的一声脆响。银皮崩开，露出灰黑色的铅。||满殿哗然。||景和帝沉声：\"查验！\"||逐箱开验。表层真银，底下全是裹银皮的铅锭。死寂中，上百道目光转向末席——协理支应的你。||\"节银入库，经你核销。你来告诉朕，怎么回事。\"||慌，是死路。当众喊冤，就是自己认下\"账目不清\"。你只有一条路——",
choices:[
{text:"1、当众喊冤、自辩清白",next:"ch6_q12_a"},
{text:"2、攀咬内务府、转移视线",next:"ch6_q12_b"},
{text:"3、请旨当宴彻查",next:"ch6_q12_c"}
]
},

ch6_q12_a:{
text:"你伏地，声音发颤：\"陛下明鉴！臣妾冤枉！节银入库时层层核验，臣妾绝无可能——\"||话没说完，皇帝的脸色就沉了。||\"朕问你怎么回事，你喊冤？\"||越辩越像畏罪。满殿文武看着你失态的样子，没有人敢替你说话。||\"账目错漏，协理不力。拿下！\"||你被当场拿下。||三日后，以\"渎职欺君\"之罪，赐死。",
isEnd:true,
endingId:"death_wrongaccount",
choices:[{text:"回到开篇",next:"start"}]
},

ch6_q12_b:{
text:"你急中生智，指向内务府管事：\"陛下！是内务府！节银经他们之手入库，必是他们从中做了手脚——\"||\"哦？\"皇帝的声音冷了下来，\"你有证据？\"||你张了张嘴，说不出话。||无凭据的指控在御前即是构陷，罪加一等。||\"构陷朝臣，其心可诛。拿下！\"||你被拖了下去。",
isEnd:true,
endingId:"death_frameup",
choices:[{text:"回到开篇",next:"start"}]
},

ch6_q12_c:{
text:"你出列，跪：\"臣妾有罪。节银入库，臣妾失察，此罪一。但臣妾请陛下准许——当宴彻查。\"||景和帝眯眼：\"彻查？\"||\"铅银入库，无非三处可能：路上调换、入库后调换、从一开始就不是银子。三本账，臣妾请当宴逐一对来。若有一本对不上，臣妾领罪。\"||你抬头：\"账目之事，最怕暗查。明查，当着满朝文武，查出来的每一个字都是铁。臣妾不怕查——臣妾请陛下，查个明白。\"||太后轻笑：\"好一个'查个明白'。皇帝，就让她查。\"||景和帝：\"准。\"",
choices:[{text:"当宴彻查",next:"ch6_scene3"}]
},

ch6_scene3:{
text:"第一本账：贡队沿途驿馆交接文书，一站一站对——火漆自扬州至京城，封印完好。路上没有开箱。||第二本账：入库当夜值守记录——抽验十锭，皆为真银。||第三本账：剥开铅锭银皮，露出铅块上的产地戳——京郊铅场。而京郊铅场的采买文书，归户部银库管。||你跪奏：\"三本账对完：银子不是路上换的，不是入库后换的——是从户部银库出来的时候，就是铅的。\"||满殿屏息。所有人都想到了同一个名字：户部银库的钥匙，一在户部尚书，一在提督库房的禁军统领——皇后的亲弟弟，萧家家主。||皇后的脸色白了。你跪在殿中，只差最后一句话。||说出口，铁证如山，满殿皆闻。然后呢？动萧家就是动禁军，皇帝不敢在这个节骨眼上换禁军。他不敢，就必须保皇后；保皇后，就必须压下此事——而最先被灭口的，就是你。||你叩首：\"臣妾查到这里，不敢再查了。库房值守库吏三十余人，铅银混入，必是库吏中出了内鬼，盗换官银。臣妾请陛下彻查库吏，追赃问罪。至于钥匙之责——库房制度或有疏漏，请陛下责成重订出入之制。\"||长久的死寂。皇帝的目光在你脸上停了很久。||\"准。库吏盗银，交刑部严查。库房制度，着敬妃与沈嫔重订。起来吧。地上凉。\"||太液池畔廊下。夜半。||宴散。萧景澜拦住回宫的你，似笑非笑。||\"十万两的功劳，查到最后一手，为什么收手？指着萧家，今夜倒的就是皇后一系。多好的机会。\"||你回头：\"殿下觉得，那是机会？那是陷阱。\"||\"哦？\"||\"我今夜指着萧家，证据确凿，满殿皆闻。然后呢？动萧家就是动禁军。北边兵事未平，皇帝敢换禁军吗？他不敢，就必须保皇后；保皇后，就必须压此事；压此事，满殿看见证据的人里，最先被灭口的，就是我。\"||你望着水面明灭的莲花灯，轻声：\"所以这笔账，不能算清。捏在手里，才是悬在萧家头上的刀——他们知道自己露了破绽，往后每一步都得掂量；也是我的保命符——皇帝知道我知道，只要他还需要一个'知道而不言'的人，我就还有用。\"||\"账，不是算清的——是捏住的。\"||萧景澜凝视良久，缓缓笑了：\"沈姑娘，你比我想的还要可怕。\"||\"在这宫里，不可怕的人，活不长。\"",
choices:[{text:"三日后",next:"ch6_scene4"}]
},

ch6_scene4:{
text:"旨意下：你核账有功，晋妃位。||同日，林晚棠被皇帝召见，出来时封了贵人。||你远远看见林晚棠从含元殿出来，袖中拢着一样东西——半页烧焦的账纸。||那纸、那笔迹……前世在冷宫，你把查到的东西一页页烧掉。烧到最后一页，火堆被人踩灭了。你以为什么都没留下。||原来，留下了半页。原来那半页，一直在等着今天。||半页烧焦的账纸——前世的火，烧到今生来了。",
choices:[{text:"前往第七章",next:"ch7_start"}]
},

ch7_start:{
text:"【第七章 灰烬重生】||凤仪宫。夜。||林晚棠跪呈半页烧焦的账纸。皇后凑近灯火细看——残存的签押、\"佛事\"名目，清清楚楚。||\"这是谁的账？\"||林晚棠伏地：\"臣妾不敢妄言。只是这纸上的浆，是尚宫局库房专用。近一年能自由调阅旧册的——\"||她顿住，不说完。||皇后把纸拢进袖中，慢慢饮茶。||\"你倒是有心。\"||\"臣妾只是不想看见，有人把娘娘和皇上要平的账，再翻出来晒。账平了，大家才能安生。\"||皇后笑，笑意不达眼底：\"起来吧。本宫记着你的好。\"||林晚棠退出凤仪宫，回望宫阙，唇角弧度冷得像冰。||前世我用这半页纸没能留住的东西。今生——让它物归原主。||沈珠寝殿。深夜。||你被苏禾摇醒，殿外火把通明，禁军已进院。||苏禾声音发抖：\"小主！奉旨搜宫——\"||内侍捧旨，面无表情：\"有人告发娴妃宫中私藏违逆之物，着即查验。\"||翻箱倒柜。一炷香后，妆奁夹层中搜出一封密信。特写：玄镜司暗记。||内侍捧着信，只说了一句：\"娘娘，请随奴才走一趟。\"||你看着满地狼藉，忽然笑了。||好狠，好准。玄镜司的暗记钉你，再拖萧景澜下水。能同时摸到这两条线、做出这封信的——前世今生，只有一个人。||你被带出寝殿。苏禾被两个内侍架住，哭喊。||\"小主是冤枉的！那封信不是我们宫里的！你们放开我——\"||你驻足，声音很稳：\"苏禾。别喊了。去敬妃娘娘宫里，把我枕头底下那本私账取出来，交给敬妃娘娘。只交这一样。无论发生什么——只交这一样。\"||苏禾怔住，含泪点头。",
choices:[{text:"前往宗人府偏殿",next:"ch7_scene2"}]
},

ch7_scene2:{
text:"宗人府偏殿（禁足处）。日。||你素衣禁足。老宫女进来回话。||\"娘娘，三殿下被自查了……玄镜司的暗记出在那封密信上，他得自证清白。还有……苏禾被带走了，说是'知情宫婢，着即审讯'。\"||你坐在窗下，很久没有动。窗外天色阴沉。||两辈子，她都在替你喊冤。",
choices:[
{text:"1、立刻递消息给敬妃，请她护住苏禾",next:"ch7_q13_a"},
{text:"2、不动，先保全大局",next:"ch7_q13_b"},
{text:"3、绝食抗议，以自身要挟",next:"ch7_q13_c"}
]
},

ch7_q13_a:{
text:"你托老宫女递消息给敬妃，请她出面护住苏禾。||敬妃收到消息，叹了口气，还是派人去了慎刑司。||苏禾的苦减轻了一些，但敬妃对你的好感，也消耗了一分。||在这深宫里，人情是要还的。",
choices:[{text:"至暗时刻",next:"ch7_q14"}]
},

ch7_q13_b:{
text:"你闭上眼睛，没有动。||苏禾在审讯中多熬了一夜。你听见远处传来的隐约惨叫声，指甲掐进掌心。||但你知道，此刻任何轻举妄动，都会让局面更糟。||先保全大局。苏禾……你只能先对不起她了。",
choices:[{text:"至暗时刻",next:"ch7_q14"}]
},

ch7_q13_c:{
text:"你开始绝食。||两天水米不进，你虚弱得几乎坐不住。老宫女慌了，层层上报。||但绝食换来的不是同情，而是更严密的看管。||第三天，你体力不支，昏厥过去。||再次醒来时，你已经被移入了更深的冷院。没有人再来看你。||一个月后，你死于冷院。死因：绝食自尽。无人追问。",
isEnd:true,
endingId:"death_hunger",
choices:[{text:"回到开篇",next:"start"}]
},

ch7_q14:{
text:"至暗时刻。||认罪，是死路——但主犯一招，审一个宫婢就没了意义，也许能换苏禾一条命。||不认，案子往下审，苏禾就是那个\"知情人\"，审讯不会停。||你必须做出选择。",
choices:[
{text:"1、认罪保苏禾",next:"ch7_q14_a"},
{text:"2、不认罪，硬撑",next:"ch7_q14_b"},
{text:"3、密信太后",next:"ch7_q14_c"}
]
},

ch7_q14_a:{
text:"你提笔，写下认罪书。||\"私通玄镜司，罪在臣妾一人。与宫婢苏禾无关。\"||认罪书递上去。苏禾被释放了。||但你也彻底输掉了大局。||三日后，你被赐死。苏禾跪在宫门外，哭到昏厥。||你用自己的命，换了她的命。||这一局，你输了。但你守住了一个人。",
isEnd:true,
endingId:"death_sacrifice",
choices:[{text:"回到开篇",next:"start"}]
},

ch7_q14_b:{
text:"你咬紧牙关，不认罪。||案子往下拖。苏禾在审讯中熬了一天又一天。||你不知道她能不能撑住。但你知道，一旦认罪，就再也没有翻盘的机会。||硬撑。||日子一天天过去。你的处境越来越糟，但你还在等。||等一个机会。||第八天，老宫女带来消息：苏禾在审讯中\"不慎\"撞柱，重伤昏迷。||你浑身冰冷。||再撑下去，苏禾会死。而你，也看不到翻盘的希望。||三日后，苏禾伤重不治。你被以\"私通外臣、知情不报\"之罪，赐死。||硬撑的代价，是两条命。",
isEnd:true,
endingId:"death_hardhold",
choices:[{text:"回到开篇",next:"start"}]
},

ch7_q14_c:{
text:"你忽然睁眼。||中秋那夜，你没有指认萧家——但你查到的三本账，一样不少记在那本私账里。那本账，如今在敬妃手里。||太后要的从来不是你的命，也不是皇后的命——她要的是萧家不能把皇家的账变成私库。||你起身：\"请姑姑替我递一句话到太后宫里：娴妃罪嫌之身，不敢求见。只求太后问一句——中秋夜那十万两铅银，臣妾查到的三本账，记在敬妃娘娘手里的一本册子上。那本册子，臣妾想请太后过目。\"||老宫女犹豫：\"您如今这处境，太后未必肯见……\"||你望向窗外，声音轻而稳：\"她会见。账乱了，总有人要平。平账的人，不会嫌手里的账本多。\"||偏殿外。夜。||鸾驾停于殿外。太后隔帘翻阅那本私账，灯笼明明灭灭。良久。||太后帘内：\"这账，哀家收了。至于你——先委屈几日。账要对完，人才能放。\"||鸾驾起行。你立于殿门，朝那个方向端正一福。||赌赢了。||画面切：审讯室内，审讯的人换了一批。新来的人只问一句话，翻来覆去——||\"那封密信，是谁放进你们娘娘妆奁的？\"||账递到了太后手里，而审讯室里的问题，指向真正的执刀人。",
choices:[{text:"前往第八章",next:"ch8_start"}]
},

ch8_start:{
text:"【第八章 太后的锦盒】||慈宁宫暖阁。夜。||一盏孤灯。太后把一只旧锦盒推过御案。皇帝看着它，没有伸手。||皇帝声音发哑：\"母后，这是什么？\"||\"你父皇的账。也是你的账。\"||皇帝掀开盒盖：一道明黄敕书，一册薄账。特写敕书末页，先帝字迹：\"此事不入正册，经手者皆朕之人。后世子孙，不得追查。\"||皇帝抬头：\"所以母后这些年……\"||太后：\"哀家守着它，是守你父皇身后的名。可哀家今日拿出来，是要告诉你另一件事。\"||太后取出半页焦纸与一沓供状，放在敕书旁。||\"娴妃的案子，哀家让人重审了。那封'私通玄镜司'的密信，是伪造的——信纸是尚宫局库纸，可玄镜司暗记用的是三年前的旧墨。暗记每年一换，用旧墨的，只能是翻旧档仿出来的。\"||皇帝手指收紧。||\"递这半页账纸进凤仪宫的，是林贵人。可一个入宫半年的贵人，从哪儿得来库房专用的账纸？哀家审了凤仪宫的掌事姑姑——那半页纸，是姑姑从旧档里挑出来，交给她的。\"||太后的灯光落在她清亮得吓人的眼睛里：\"皇后要平的，不是账。她是要把知道账的人，一个一个垫进去。今天垫沈家的女儿，明天垫哀家宫里的人——后天，萧家就要拿这宫里的账，当萧家自己的账本了。\"||\"皇帝，账乱不乱，是小事。账落到外戚手里，是什么事，你比哀家清楚。\"||皇帝沉默良久。||\"传沈氏。\"",
choices:[{text:"前往慈宁宫大殿",next:"ch8_scene2"}]
},

ch8_scene2:{
text:"慈宁宫大殿。夜。||你一身素衣上殿。殿上皇帝、太后；案上摊着焦纸与伪信。||皇帝听不出情绪：\"沈氏，你可知罪？\"||你叩首：\"臣妾不知。但臣妾备了三本账，请陛下与太后过目。\"",
choices:[
{text:"1、三本全呈，包括影账",next:"ch8_q15_a"},
{text:"2、只呈前两本，影账留下",next:"ch8_q15_b"},
{text:"3、呈第三本但抽掉末页",next:"ch8_q15_c"}
]
},

ch8_q15_a:{
text:"你呈上三册。||第一本：对贡银之账——铅块产地戳、铅场三年采买文书、银子流向：批钱的，是禁军统领衙门。铅银不是库吏盗换的，是从铸锭时就掺进去的。||第二本：对密信之账——玄镜司旧档领用记录：三个月前，凤仪宫以\"修补旧档\"为名，调阅过玄镜司三年前的文书。||第三本：对影账之账——七年流水对到出宫为止。末页一行小字特写：\"账外出路，臣妾不敢查，亦不愿查。此账是皇家的账，臣妾只是记账的人。\"||太后先看完，推给皇帝。皇帝逐本看完，目光停在第三本末页。||\"你倒是有分寸。\"||\"臣妾的命是账给的。臣妾知道什么账能查——什么账，只能捏着。\"||皇帝凝视你很久，忽然笑了。笑意很淡，凉薄而清醒。||\"起来吧。案子销了，回你的宫去。协理的差事照旧——另，着内务府，赏。\"||你叩首。||没有半个字的歉意。帝王不道歉，帝王只算利害——你还有用，所以你还活着，还要升。前世你死时还抱着\"帝王明鉴\"的幻想。今生你明白了：你要的从来不是皇帝的公道，是皇帝的需求。||太后忽然开口：\"林氏呢？\"||皇帝：\"伪造证物，构陷嫔妃，按律——\"||太后淡淡地：\"打入冷宫。她不是喜欢账吗？让冷宫里的人，陪她慢慢算。\"",
choices:[{text:"前往冷宫门口",next:"ch8_scene3"}]
},

ch8_q15_b:{
text:"你呈上了前两本——贡银之账和密信之账。||皇帝和太后看完，脸色微变。||\"第三本呢？\"太后问。||你垂眸：\"第三本……臣妾尚未核完，不敢妄呈。\"||太后的目光冷了下来。||她已经出手救你，你却还在藏着掖着。藏账即是藏心。||\"既未核完，就回去核吧。\"||你被遣回。案子虽然销了，但太后对你的信任，尽失。||没有了太后的庇护，你在这宫里的路，只会更难走。",
choices:[{text:"前往冷宫门口",next:"ch8_scene3"}]
},

ch8_q15_c:{
text:"你呈上了三本账。但第三本的末页——那句\"账外出路，臣妾不敢查\"——被你抽掉了。||你想留一手。||皇帝翻到第三本，眉头一皱。||\"末页呢？\"||你心头一紧：\"末页……许是装订时遗漏……\"||太后冷笑：\"装订遗漏？沈氏，你当哀家和陛下是瞎子？\"||当场对验。尚宫局的原始档册上，末页清清楚楚。||欺君之罪，铁证如山。||\"拿下！\"||你被拖了下去。",
isEnd:true,
endingId:"death_lordlie",
choices:[{text:"回到开篇",next:"start"}]
},

ch8_scene3:{
text:"冷宫门口。夜。||林晚棠披发被押至冷宫门前，回头看见你，忽然大笑——笑里没有算计，只有近乎痛快的认输。",
choices:[
{text:"1、沉默目送",next:"ch8_q16_a"},
{text:"2、问她：\"若前世你赢了，你打算做什么？\"",next:"ch8_q16_b"},
{text:"3、动了恻隐，跪求太后开恩",next:"ch8_q16_c"}
]
},

ch8_q16_a:{
text:"你站在三步外，沉默目送。||林晚棠笑够了，忽然开口：\"两辈子，我输给同一本账。\"||你轻声：\"你不是输给账。你是太信账了。你以为把账做平了，人就能安生。可账是死的，人是活的——你垫进去的那些人，他们也会算账。\"||林晚棠怔住，笑着笑着，眼泪落下来。||她被推着往冷宫里走，声音渐远：\"好妹妹，下辈子——\"||你轻声：\"没有下辈子了。这辈子，把账算清就够了。\"||冷宫门合上，沉重的一声——和前世一样。只是这一次，站在门外的，换了人。",
choices:[{text:"前往宫道",next:"ch8_scene4"}]
},

ch8_q16_b:{
text:"你上前一步，问她：\"若前世你赢了，你打算做什么？\"||林晚棠的笑声停了。||她看着你，很久很久，忽然轻声说：\"赢了？我从来没想过赢了之后做什么。我只知道，不把你垫进去，被垫进去的就是我。\"||\"这宫里，谁不是在算账呢？你算你的，我算我的。算到最后，谁也没赢。\"||她被推入冷宫。门合上前，她回头看了你一眼。||那一眼里，没有恨，只有释然。||你解锁了林晚棠的真心。两辈子的恩怨，在这一刻，终于有了一个答案。",
choices:[{text:"前往宫道",next:"ch8_scene4"}]
},

ch8_q16_c:{
text:"你看着林晚棠被押入冷宫，心中忽然一动。||两辈子的姐妹，纵然她害过你，可你也……||你转身，直奔慈宁宫，跪求太后开恩。||太后听完，脸色沉了下来。||\"娴妃，林氏伪造证物、构陷嫔妃，铁证如山。你替她求情——是觉得哀家冤枉了她？还是你和她之间，有什么私交？\"||你张了张嘴，说不出话。||太后疑你与构陷案有私。||\"既然娴妃与林氏姐妹情深，那就——一起去冷宫做伴吧。\"||妇人之仁，害了自己。",
isEnd:true,
endingId:"death_mercy",
choices:[{text:"回到开篇",next:"start"}]
},

ch8_scene4:{
text:"宫道。夜。||萧景澜拦路，递来一册脆黄的原始账册。||\"罪销了，差事也回来了。不过在你高兴之前，先看一眼这个——玄镜司从户部底库挖出来的，影账起始年的原始底册。你见过的那本，是后来誊抄存档的。\"||你翻到影账第一次落笔的那页——签批栏旁，誊抄本里被抹掉的花押，在原件上还在。那是宫中内侍的签押格式。||萧景澜声音压低：\"当年真正经办这笔账、落第一笔的人——先帝身边的大太监。你猜，他如今在哪儿？\"||你指尖发涩：\"在哪儿？\"||萧景澜望向慈宁宫方向，眼神深得像井：\"慈宁宫。太后宫里的总管，侍奉太后三十年，从未离宫。\"||\"沈姑娘，你以为这盘棋，你看到了第三层。可执棋的手，从头到尾——都在你以为已经看清的那盏灯底下。\"||最深的执棋人，就藏在太后身边。",
choices:[{text:"前往第九章",next:"ch9_start"}]
},

ch9_start:{
text:"【第九章 天下之账】||慈宁宫暖阁。夜（太后病重）。||太后卧榻，你侍疾。灯下，太后忽然睁眼。||太后声音轻得像纸：\"你怕哀家死？……不用答。哀家问你——哀家死了，你的账，找谁捏着？\"||你沉默片刻，跪于榻前：\"所以臣妾有一个法子。请太后允臣妾——核天下之账。\"||\"说。\"||\"影账之所以是刀，因为它在暗处。暗处的账，谁捏着，谁就有刀——萧家可以拿它挟持后宫，后宫可以拿它攀咬朝臣，朝臣可以拿它要挟皇室。可若这本账不在暗处了呢？\"||\"臣妾请设内藏库。军饷不再走宫中暗道，由户部兵部会同，明立科目，明定数额，每年入册，昭于御前。把影账，从暗处搬到明处。账一明，刀就没了——谁都拿着一把人人看得见的刀，砍不了人。\"",
choices:[
{text:"1、只要内藏库，不要私利",next:"ch9_q17_a"},
{text:"2、借机先求昭雪沈家",next:"ch9_q17_b"},
{text:"3、请求将影账原本交你保管",next:"ch9_q17_c"}
]
},

ch9_q17_a:{
text:"太后听完，长久的静。||她忽然笑了，笑得咳嗽起来。||\"哀家守这本账三十年，想的都是怎么把它捂严。你一个二十岁的丫头，想的是把它晒到太阳底下。\"||她松手，闭眼：\"好。哀家准了。明日一早，你代哀家，上朝去说。\"||公心立住。太后与皇帝，皆信你。",
choices:[{text:"前往含元殿",next:"ch9_scene2"}]
},

ch9_q17_b:{
text:"你叩首：\"太后娘娘，臣妾还有一个不情之请。臣妾之父沈听舟，当年签批影账，实为北境军饷，非为私利。臣妾斗胆，请太后为先昭雪沈家——\"||话没说完，太后的脸色就变了。||\"哀家问你要什么，你说要核天下之账。原来核天下之账是假，替父翻案是真。\"||她闭上眼：\"你下去吧。内藏库的事，哀家再想想。\"||太后收回了信任。||私心先于公心，你失去了最重要的筹码。",
choices:[{text:"前往含元殿",next:"ch9_scene2"}]
},

ch9_q17_c:{
text:"你斟酌片刻，开口：\"太后娘娘，臣妾还有一请。影账干系重大，若交由他人保管，恐生变故。臣妾斗胆，请将影账原本交臣妾保管——\"||太后猛地睁眼，目光如刀。||\"保管？沈氏，你知道你在说什么吗？揽账即揽权。你一个嫔妃，要保管皇家最隐秘的账本——你想做什么？\"||你浑身冷汗。||\"哀家本以为你是个明白人。看来，是哀家看走了眼。\"||\"来人——\"||你被以\"私藏宫档、意图不轨\"之罪，拿下。||三日后，赐死。||揽账的人，从来没有好下场。",
isEnd:true,
endingId:"death_jade",
choices:[{text:"回到开篇",next:"start"}]
},

ch9_scene2:{
text:"含元殿。日。||你以嫔妃之身立于珠帘之后，代太后宣谕。满朝死寂听完\"设内藏库、核天下账\"。||户部尚书出列：\"祖制无此先例——\"||景和帝声音微弱，一字一顿：\"准。行。\"||散朝。雪开始下。你立于丹墀，望着漫天大雪。||这道谕旨，是萧家的催命符。账一明，铅银案、库房案、七年烂账，桩桩件件都会摊在太阳底下。萧家等不到那一天了——所以他们，也不会等。",
choices:[{text:"冬至夜（决战）",next:"ch9_scene3"}]
},

ch9_scene3:{
text:"含元殿前。冬至夜（决战）。||甲胄林立，火把照雪夜如白昼。萧大人按剑立于阶下，身后禁军三千，十几位被连夜\"请\"来的重臣。||萧大人扬声：\"陛下病重，奸佞窃权，宫中账目混乱！本将奉命护驾，请诸公随我入殿，清君侧——\"||你的声音自丹墀之上落下：\"账目混乱？\"||众人抬头。高台上，你素衣迎风，手捧一册账，一页一页缓缓翻开。||\"那本将今日，就当殿跟大人对一对账。景和三年，佛事拨银，其中三万两经京郊铅场，入大人私库——账页在此，经手画押在此。\"||你翻页：\"景和五年，北境军饷扣一成火耗，入萧家在通州的钱庄——掌柜姓萧，是大人族侄。\"||你抬眼：\"去岁中秋，十万两铅银——这一笔不用对了。满朝文武，都亲眼看着呢。\"||雪越下越大。禁军阵中开始骚动。||萧大人厉声：\"一派胡言！此女妖妃，构陷忠良！来人——\"||你不停，一页页翻：\"还有。兵部侍郎王大人，景和四年领过萧家银一千两，账在此。户部员外郎李大人，替萧家在盐引上做保，得银八百，账在此——\"||每念一个名字，人群中便有人面如死灰地低头。被\"请\"来的重臣们一个一个往后退。||萧大人拔剑：\"够了！放箭——\"",
choices:[
{text:"1、不退不停，继续念账",next:"ch9_q18_a"},
{text:"2、退到宫门之后",next:"ch9_q18_b"},
{text:"3、开口与萧大人谈条件",next:"ch9_q18_c"}
]
},

ch9_q18_a:{
text:"你不退。不停。||你继续翻页，声音在雪夜中清晰而坚定：\"景和六年，江南织造……\"||箭在弦上。但没有一个士兵放箭。||他们听着你念出的每一笔账，看着萧大人越来越苍白的脸。军心，在一点点溃散。||萧大人怒吼：\"放箭！你们聋了吗！\"||没有人动。||就在这时，宫门洞开。玄甲兵士潮水涌入，萧景澜玄袍白马，身后是虎符与玄镜司暗桩、京郊大营驰援的边军。||萧景澜勒马，笑：\"萧大人，你的箭，射谁呢？\"||\"玄镜司查萧家，查了十年。你猜，你的禁军里，有多少人是我们的人？\"||禁军阵型自内部崩解，兵刃落地声连成一片。||那一夜，萧家满门下狱。",
choices:[{text:"三日后",next:"ch9_scene4"}]
},

ch9_q18_b:{
text:"你转身退到宫门之后。||气势一泄。||萧大人见状，厉声下令强攻。||宫门被撞开。萧景澜被迫带兵强攻，双方在含元殿前展开血战。||死伤惨重。||虽然最终萧景澜凭借玄镜司和边军的力量平定了叛乱，但代价是——数百名禁军士兵和边军士兵的生命。||你活下来了。但你的手上，也间接沾了血。||那一夜，萧家满门下狱。",
choices:[{text:"三日后",next:"ch9_scene4"}]
},

ch9_q18_c:{
text:"你犹豫了。||\"萧大人，有话好说。你要什么，我们可以谈——\"||话一出口，你就知道错了。||犹豫即是示弱。禁军见你退让，士气大振。||萧大人冷笑：\"谈？你有什么资格跟我谈？放箭！\"||箭雨袭来。||你倒在了丹墀之上。手中的账册，散落一地，被雪浸湿。||城下之盟，从来都是输家的妄想。",
isEnd:true,
endingId:"death_alliance",
choices:[{text:"回到开篇",next:"start"}]
},

ch9_scene4:{
text:"慈宁宫。三日后。||太后临终，把锦盒交到你手中。||\"里面的东西……等账平了，再看。\"||太后薨。白幡。||凤仪宫。又三日。||皇后已换朝服，端坐妆台前。你奉旨送药，捧着青白釉小盏。||皇后接过，看着药汁，轻声笑：\"是你来。本宫还以为，会是个太监。\"||\"是臣妾向陛下请的。账本里，娘娘的名字不该写进冷宫那一页。萧家是萧家，娘娘是娘娘。\"||皇后怔了怔，望着镜中华贵的自己：\"本宫这一生，守着一本烂账，替萧家当了半辈子刀。到头来送本宫上路的，是本宫最想垫进账里的人。\"||她仰头饮尽。空盏放在妆台上——那只青白釉小盏，与冷宫毒酒杯同窑。||皇后伏在妆台，声音渐弱：\"沈珠……下辈子，本宫也想学学记账。记一本……干干净净的。\"||气息散尽。你立于原地，久久未动。||前世你死时想，若能重来，要让所有欠账的人付出代价。如今账平了，你才发现——你真正想要的，从来不是谁的命。是往后的人，不必再这样死。||皇帝寝殿。夜。||病榻上的帝王瘦脱了形，眼睛却还亮着。屏退左右。||\"你替朕算清了这宫里所有的账。如今，朕要你算最后一笔。\"||你跪：\"哪一笔？\"||皇帝一字一句：\"太子的账。\"||最后一笔账——托孤。",
choices:[{text:"前往第十章",next:"ch10_start"}]
},

ch10_start:{
text:"【第十章 掌中珠】||皇帝寝殿。夜（接上章）。||\"朕想立你为后。后位掌六宫，也掌内藏库。满朝文武里，朕信不过会算账的；会算账的里面，朕只信你不贪。\"||你伏地，久久未抬头。||接了，你这一生就永远是棋盘上管账的人——先帝用它平账，今帝用它托孤，来日的天子用它平衡朝局。||可不接，沈家的冤没有昭雪，十岁的太子底下，还压着多少本没见光的账？||你叩首：\"陛下容臣妾三日。三日后，臣妾给陛下回话。\"",
choices:[{text:"前往宗人府狱中",next:"ch10_scene2"}]
},

ch10_scene2:{
text:"宗人府狱中。日。||栅栏内外，父女相见。沈听舟鬓发全白，神色安稳。||\"账要平了？\"||\"快了。女儿想听父亲一句话——当年签那笔账，父亲后悔吗？\"||沈听舟沉默良久，摇头：\"不悔。那笔账走的是军饷，是北边几十万条人命。悔的是——以为担下罪名，就能护住所有人。\"||\"珠儿，账能担，人担不住。往后你若记账，记明账。\"",
choices:[{text:"前往御花园水榭",next:"ch10_scene3"}]
},

ch10_scene3:{
text:"御花园水榭。日。||一年前结盟的地方。萧景澜听完你的来意。||\"若你出宫，想去哪儿？\"||你怔了怔，笑：\"我父亲说过，江南的账房先生，日子过得最安稳。\"||萧景澜望着水面，轻声：\"那就去江南。玄镜司有一条暗路，送你出去，没人找得到。\"||\"殿下呢？\"||他笑了笑，语气懒散，眼里却有一点别的东西：\"我留下。太子的账，总得有人替你先看着。等你什么时候想回来了——账本还给你留着位置。\"",
choices:[{text:"前往冷宫深处",next:"ch10_scene4"}]
},

ch10_scene4:{
text:"冷宫深处。夜。||林晚棠坐在窗前，就着残灯，用树枝在地上画着什么。听见脚步，抬头，笑了。||\"来看我的笑话？\"||你在她对面蹲下：\"来问你一句话。你两辈子都想把账做平——做平了，然后呢？\"||林晚棠握着树枝的手停了停。低头继续画。特写地上：一笔一笔的账，工工整整，没有挪移涂改，每一笔末尾写着同一个名字——她自己的名字。||她轻声：\"做平了，就不用再有人垫底了。\"||她抬头，眼里第一次没有算计，只剩近乎恳求的东西：\"好妹妹，替我记一笔。记在明处。\"",
choices:[{text:"前往含元殿（三日之期）",next:"ch10_q19"}]
},

ch10_q19:{
text:"含元殿。日（三日之期）。||百官齐聚。病体临朝的皇帝问出那句等待已久的话。||\"沈氏，朕欲立你为后。你可愿？\"||殿上安静得能听见呼吸。",
choices:[
{text:"1、愿，并呈上三本账",next:"ch10_q19_a"},
{text:"2、不愿，请旨出宫",next:"ch10_q19_b"},
{text:"3、愿，但请陛下先下诏立内藏库为永制",next:"ch10_q19_c"},
{text:"4、沉默不语",next:"ch10_q19_d"}
]
},

ch10_q19_a:{
text:"你出列，撩裙跪拜，抬头。||声音清晰，传遍大殿：\"臣妾，愿。但臣妾有一事相求。\"||你从袖中取出三本册子，双手呈上。||\"臣妾为后，不求凤冠霞帔，只求这三本账。\"||\"第一本，影账。请陛下准臣妾设内藏库，将此账制度化——明立科目，岁入岁出，皆录于册，昭于御前。从此军饷不走暗道，皇家的账，记在明处。\"||\"第二本，沈家案。臣妾之父签批影账，奉先帝手敕，为的是北境军饷，非为私利。请陛下昭雪沈家，昭告天下——经手者担的是责，不是罪；账有明账，人便不必以命平账。\"||你呈上最后一本——崭新的空白账册。||\"第三本。这本账，臣妾留给天下。往后每一笔——百姓的赋税，边关的军饷，宫中的用度，官吏的俸禄——都记在这一本上。记在明处，人人可查。\"||\"臣妾为后，不为掌天下之财——只为天下之财，皆有账可查，有处可对。\"||死寂十息。龙椅上油尽灯枯的帝王，撑着扶手一点点站起身。||皇帝声音微弱，字字清楚：\"准。传朕旨意——立沈氏为后，掌内藏库，核天下之账。\"||坤宁宫。登基大典夜。||礼成。宫人退下，殿门合拢。大雪满窗。你独坐窗前，取出那本空白的账，提笔，在第一页工工整整记下一笔。||特写字迹：||\"景和十年冬，大雪。内藏库立。自此，账记明处。\"||笔尖顿了顿，又添一行：||\"前世，我死于账本里的冷宫。今生，我要这天下的账，由我来记。\"||窗外雪落无声。画面渐暗。||——真结局【掌中珠】·完——",
isEnd:true,
endingId:"ending_pearl",
choices:[{text:"回到开篇",next:"start"}]
},

ch10_q19_b:{
text:"你伏地，声音平静：\"陛下，臣妾……不愿。\"||满殿哗然。||皇帝的脸色变了：\"你说什么？\"||\"臣妾谢陛下隆恩。但臣妾出身卑微，才德不足以母仪天下。臣妾只求陛下准臣妾出宫，青灯古佛，了此残生。\"||皇帝凝视你很久，忽然笑了，笑得疲惫。||\"你倒是……比朕想的要洒脱。准。\"||你出宫了。||三年后。江南小巷，新开的账房挂起幌子，上画一枚算盘。账房先生是位年轻女子——你。||一位旅人歇脚讨茶，闲聊京中见闻。||\"听说朝廷设了内藏库，天下的账都记在明处，御史年年核账，再没出过大案子。宫里那位……留下的规矩。\"||你端茶的手轻轻一顿。||\"是吗。那挺好的。\"||旅人走后。你收拾茶碗，目光落在柜台的算盘上——珠子被摩挲得温润发亮。你伸手，把算盘轻轻一推。||特写：算盘珠子哗啦一响，归零。||账记完了。灯，该点了。||暮色四合，小巷深处炊烟升起。画面渐暗。||——结局【江南旧梦】·完——",
isEnd:true,
endingId:"ending_jiangnan",
choices:[{text:"回到开篇",next:"start"}]
},

ch10_q19_c:{
text:"你出列，跪拜：\"臣妾，愿。但臣妾有一个条件。\"||\"请陛下先下诏，立内藏库为永制——非一朝一帝可废，非一人一姓可改。内藏库之账，年年核，代代传。陛下若允，臣妾便受此凤冠。\"||皇帝沉默了。||以制度为聘，这是你要的保障。||他看了你很久，缓缓点头：\"好。朕答应你。内藏库，为大启永制。\"||\"传朕旨意——立沈氏为后，掌内藏库。内藏库之制，世代相传，非朝议不得废。\"||你叩首谢恩。||这一次，你不只是记账的人——你立下了一个制度。||哪怕将来你不在了，内藏库还在。天下的账，还在明处。||坤宁宫。夜。||你提笔，在空白账册的第一页写下：||\"景和十年冬，大雪。内藏库立，为永制。自此，账记明处，代代相传。\"||窗外雪落无声。||——真结局【掌中珠·永制】·完——",
isEnd:true,
endingId:"ending_pearl_forever",
choices:[{text:"回到开篇",next:"start"}]
},

ch10_q19_d:{
text:"你伏地，没有说话。||一秒。两秒。五秒。||殿上的呼吸声都清晰可闻。||皇帝的脸色一点点沉了下来。||\"沈氏，朕问你话。\"||你还是没有开口。||帝心难测，沉默即是心虚。||皇帝的目光冷了：\"既然不愿，就不必勉强。来人——送娴妃回储秀宫，没有朕的旨意，不得出宫。\"||你被禁足了。||三日后，皇帝驾崩。新帝登基，你被以\"先帝遗孀、心怀怨怼\"之名，送入感业寺为尼。||青灯古佛，了此残生。||你终究没有走出那本账。||——死亡结局【君心难测】·完——",
isEnd:true,
endingId:"death_silence",
choices:[{text:"回到开篇",next:"start"}]
}

};

const endingMeta = {
ending_pearl:"真结局：掌中珠",
ending_pearl_forever:"真结局：掌中珠·永制",
ending_jiangnan:"结局：江南旧梦",
death_escape:"死亡：逃避即死",
death_toofast:"死亡：树大招风",
death_overstep:"死亡：越界",
death_snake:"死亡：打草惊蛇",
death_wrongaccount:"死亡：账目错漏",
death_frameup:"死亡：构陷",
death_hunger:"死亡：以卵击石",
death_sacrifice:"死亡：舍身保人",
death_hardhold:"死亡：硬撑",
death_lordlie:"死亡：欺君",
death_mercy:"死亡：藕断丝连",
death_jade:"死亡：怀璧其罪",
death_alliance:"死亡：城下之盟",
death_silence:"死亡：君心难测"
};

let currentNodeId = "start";
let historyStack = [];
let typingTimer = null;
let unlockEndings = JSON.parse(localStorage.getItem("endings")||"[]");
let speedCfg = JSON.parse(localStorage.getItem("textSpeed")||'{"idx":1,"arr":[85,52,32,20]}');
const speedTextArr = ["0.75x","1x","1.5x","2x"];
const textDom = document.getElementById("textContent");
const choiceDom = document.getElementById("choiceBox");
const dialogBox = document.getElementById("dialogBox");
const btnSpeed = document.getElementById("btnSpeed");
let state = "idle";
let currentPageText = "";
let pageList = [];
let pagePtr = 0;

function updateSpeedBtn(){
btnSpeed.innerText = "文字速度:"+speedTextArr[speedCfg.idx];
}
updateSpeedBtn();
dialogBox.onclick = function(){
if(state === "typing"){
clearTimeout(typingTimer);
typingTimer = null;
textDom.innerText = currentPageText;
dialogBox.scrollTop = dialogBox.scrollHeight;
state = "waitClick";
return;
}
if(state === "waitClick"){
nextPage();
}
}
window.addEventListener("keydown",(e)=>{
if(document.querySelector(".modal.active")) return;
if(state === "idle") return;
if(e.code === "ArrowRight"){
e.preventDefault();
if(state === "typing"){
clearTimeout(typingTimer);
typingTimer = null;
textDom.innerText = currentPageText;
dialogBox.scrollTop = dialogBox.scrollHeight;
state = "waitClick";
}else if(state === "waitClick"){
nextPage();
}
}else if(e.code === "ArrowLeft"){
e.preventDefault();
if(state === "typing"){
clearTimeout(typingTimer);
typingTimer = null;
}
if(pagePtr > 0){
pagePtr--;
showPageDirect(pageList[pagePtr]);
}
}
})
function showPageDirect(str){
state = "waitClick";
currentPageText = str;
textDom.innerText = str;
dialogBox.scrollTop = 0;
}
function nextPage(){
pagePtr++;
if(pagePtr >= pageList.length){
state = "idle";
renderChoices(storyData[currentNodeId]);
return;
}
playPage(pageList[pagePtr]);
}
function playPage(str){
state = "typing";
currentPageText = str;
textDom.innerText = "";
let i=0;
function tick(){
if(i >= str.length){
state = "waitClick";
dialogBox.scrollTop = dialogBox.scrollHeight;
return;
}
textDom.innerText += str[i++];
dialogBox.scrollTop = dialogBox.scrollHeight;
typingTimer = setTimeout(tick, speedCfg.arr[speedCfg.idx]);
}
tick();
}
function renderChoices(node){
choiceDom.innerHTML = "";
if(node.isEnd){
if(!unlockEndings.includes(node.endingId)){
unlockEndings.push(node.endingId);
localStorage.setItem("endings",JSON.stringify(unlockEndings));
}
const btn = document.createElement("button");
btn.className="choiceBtn";
btn.innerText="回到开篇";
btn.onclick=(e)=>{e.stopPropagation();historyStack=[];goNode("start");};
choiceDom.appendChild(btn);
return;
}
for(let ch of node.choices){
const btn = document.createElement("button");
btn.className="choiceBtn";
btn.innerText = ch.text;
btn.onclick=(e)=>{e.stopPropagation();goNode(ch.next);};
choiceDom.appendChild(btn);
}
}
function goNode(nodeId){
clearTimeout(typingTimer);
state = "idle";
const node = storyData[nodeId];
if(node.choices) historyStack.push(nodeId);
currentNodeId = nodeId;
choiceDom.innerHTML = "";
pageList = node.text.split("||").map(s=>s.trim()).filter(s=>s);
pagePtr = 0;
if(pageList.length>0){
playPage(pageList[0]);
}else{
renderChoices(node);
}
}
document.getElementById("btnBack").onclick=(e)=>{
e.stopPropagation();
if(historyStack.length<=1){alert("无法回退");return;}
historyStack.pop();
goNode(historyStack[historyStack.length-1]);
}
btnSpeed.onclick=(e)=>{e.stopPropagation();speedCfg.idx=(speedCfg.idx+1)%speedCfg.arr.length;updateSpeedBtn();}
document.getElementById("btnTheme").onclick=(e)=>{e.stopPropagation();document.body.classList.toggle("light-theme");}
document.querySelectorAll(".close-btn").forEach(b=>{b.onclick=(e)=>{
e.stopPropagation();
document.getElementById("saveModal").classList.remove("active");
document.getElementById("loadModal").classList.remove("active");
document.getElementById("endingModal").classList.remove("active");
}});
document.getElementById("btnSave").onclick=(e)=>{
e.stopPropagation();
document.getElementById("saveModal").classList.add("active");
const list = document.getElementById("saveList");list.innerHTML="";
for(let i=1;i<=3;i++){
const key = "save_"+i;
const div = document.createElement("div");
div.className="save-item";
div.innerText = localStorage.getItem(key)?`存档${i}：已保存`:`存档${i}：空`;
div.onclick=(ev)=>{ev.stopPropagation();localStorage.setItem(key,JSON.stringify({node:currentNodeId,history:historyStack}));alert(`已存入存档${i}`);document.getElementById("saveModal").classList.remove("active");};
list.appendChild(div);
}
};
document.getElementById("btnLoad").onclick=(e)=>{
e.stopPropagation();
document.getElementById("loadModal").classList.add("active");
const list = document.getElementById("loadList");list.innerHTML="";
for(let i=1;i<=3;i++){
const key="save_"+i;
const raw = localStorage.getItem(key);
const div = document.createElement("div");
div.className="save-item";
if(raw){
div.innerText=`存档${i}`;
div.onclick=(ev)=>{ev.stopPropagation();const d=JSON.parse(raw);historyStack=d.history??[];goNode(d.node);document.getElementById("loadModal").classList.remove("active");}
}else div.innerText=`存档${i}：空存档`;
list.appendChild(div);
}
};
document.getElementById("btnEnding").onclick=(e)=>{
e.stopPropagation();
document.getElementById("endingModal").classList.add("active");
const list = document.getElementById("endingList");list.innerHTML="";
for(const [eid,name] of Object.entries(endingMeta)){
const div = document.createElement("div");div.style.padding="6px 0";
div.innerText = unlockEndings.includes(eid)?"✅ "+name:"❓ ???（未解锁）";
list.appendChild(div);
}
};
goNode("start");
</script>
</body>
